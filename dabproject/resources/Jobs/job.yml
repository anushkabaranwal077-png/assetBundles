resources:
  jobs:
    Ingestion_Job:
      name: Ingestion_Job
      tasks:
        - task_key: Ingestion
          notebook_task:
            notebook_path: ../../src/notebooks/Ingestion.ipynb
            base_parameters:
              catalog_name: ${var.catalog_name}
            source: WORKSPACE
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
